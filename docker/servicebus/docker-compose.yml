# Local Azure Service Bus emulator.
#   Start:  docker compose -f docker/servicebus/docker-compose.yml up -d
#   Stop:   docker compose -f docker/servicebus/docker-compose.yml down
# Queues and topics are declared in config.json (the emulator has no portal).
name: booklending-servicebus

services:
  emulator:
    container_name: servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - ./config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"   # AMQP: what the .NET SDK connects to
      - "5300:5300"   # health endpoint: curl http://localhost:5300/health
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      SQL_WAIT_INTERVAL: "15"
    depends_on:
      - servicebus-sql

  # Private storage for the emulator. No published port, so it doesn't clash
  # with booklending-sql on 1433 and nothing outside Docker can reach it.
  servicebus-sql:
    container_name: servicebus-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
